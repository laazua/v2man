services:
  web:
    build: .
    ports:
      - "8055:8055"
    env_file:
      - app/.env
      - path: app/.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8022:80"
    volumes:
      - static:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    env_file:
      - app/.env
      - path: app/.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-v2man}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?数据库密码未设置，请设置 DB_PASSWORD 环境变量}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-v2man} -d v2man"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  static:
