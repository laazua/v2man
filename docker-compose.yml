services:
  web:
    build: .
    ports:
      - "8055:8055"
    env_file:
      - app/.env
      - path: app/.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    volumes:
      - static:/app/staticfiles:ro
    depends_on:
      - web

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    env_file:
      - app/.env
      - path: app/.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: v2man
      POSTGRES_USER: v2man
      POSTGRES_PASSWORD: v2man
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2man -d v2man"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  static:
